name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Installeer project
        run: python -m pip install --disable-pip-version-check -e '.[aws]'

      - name: Controleer CLI-contract
        run: lus --help >/dev/null

      - name: Vereis evalbewijs bij wijziging van het productiemodel
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          python -m lusmaker.model_gate --base "$BASE_SHA"

      - name: Draai offline tests
        run: python -m tests.run

      - name: Controleer Lambda-startscript
        run: sh -n deploy/aws/entrypoint.sh

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Controleer Terraform-formattering
        run: terraform fmt -check -recursive infra

      - name: Valideer bootstrap-stack
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/bootstrap validate

      - name: Valideer applicatiestack
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform validate

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installeer vastgepinde frontenddependencies
        run: npm ci

      - name: Controleer TypeScript
        run: npm run typecheck

      - name: Test frontendgedrag offline
        run: npm run test:unit

      - name: Installeer Chromium voor browsertests
        run: npx playwright install --with-deps chromium

      - name: Draai offline browserregressie (390 en 1280 px)
        run: npm run test:e2e

      - name: Bouw Next.js-app
        run: npm run build
