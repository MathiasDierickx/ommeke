name: Deploy Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-vercel.yml
      - web/**
  workflow_run:
    workflows: ["Deploy AWS"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lusmaker-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'lusmaker' }}
      DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT || 'prod' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Controleer Vercel-configuratie
        id: config
        env:
          HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          if [ "$HAS_VERCEL" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deploy overgeslagen: configureer VERCEL_TOKEN, VERCEL_ORG_ID en VERCEL_PROJECT_ID." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v7.0.1
        if: steps.config.outputs.ready == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v7.0.0
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: hashicorp/setup-terraform@v4.0.1
        if: steps.config.outputs.ready == 'true'
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Neem tijdelijke AWS-credentials via OIDC
        if: steps.config.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Lees publieke webconfig uit Terraform-state
        if: steps.config.outputs.ready == 'true'
        id: aws
        run: |
          terraform -chdir=infra/terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$PROJECT_NAME/$DEPLOY_ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"
          if ! CONFIG=$(terraform -chdir=infra/terraform output -json vercel_environment 2>/dev/null); then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deploy wacht op de eerste geslaagde AWS deployment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "api_url=$(jq -r '.NEXT_PUBLIC_API_URL' <<< "$CONFIG")" >> "$GITHUB_OUTPUT"
          echo "cognito_domain=$(jq -r '.NEXT_PUBLIC_COGNITO_DOMAIN' <<< "$CONFIG")" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(jq -r '.NEXT_PUBLIC_COGNITO_CLIENT_ID' <<< "$CONFIG")" >> "$GITHUB_OUTPUT"

      - name: Installeer frontenddependencies
        if: steps.config.outputs.ready == 'true' && steps.aws.outputs.available == 'true'
        working-directory: web
        run: npm ci

      - name: Koppel Vercel-project
        if: steps.config.outputs.ready == 'true' && steps.aws.outputs.available == 'true'
        working-directory: web
        run: npx --yes vercel@58.9.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Bouw voor productie
        if: steps.config.outputs.ready == 'true' && steps.aws.outputs.available == 'true'
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.aws.outputs.api_url }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ steps.aws.outputs.cognito_domain }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.aws.outputs.cognito_client_id }}
        run: npx --yes vercel@58.9.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy naar Vercel
        if: steps.config.outputs.ready == 'true' && steps.aws.outputs.available == 'true'
        working-directory: web
        run: |
          URL=$(npx --yes vercel@58.9.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "### Lusmaker web" >> "$GITHUB_STEP_SUMMARY"
          echo "Productie: $URL" >> "$GITHUB_STEP_SUMMARY"
