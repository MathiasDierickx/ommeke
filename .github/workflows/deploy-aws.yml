name: Deploy AWS

on:
  push:
    branches: [main]
    paths:
      - deploy/aws/**
      - infra/terraform/**
      - lusmaker/**
      - pyproject.toml
      - .github/workflows/deploy-aws.yml
  workflow_dispatch:
    inputs:
      refresh_route_sources:
        description: Vernieuw de Vlaamse bronsnapshots vanuit Toerisme Vlaanderen
        type: boolean
        default: false
      image_digest:
        description: >-
          Rollback: sha256-digest van een bestaande ECR-image (sha256:...). Laat leeg
          voor een gewone deployment. Er wordt niets gebouwd; checks, stale-guard,
          Terraform-plan en smoke-test blijven gelden.
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: lusmaker-aws-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'lusmaker' }}
      DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT || 'prod' }}
      REGION_SLUG: ${{ vars.LUSMAKER_REGION_SLUG || 'vlaanderen' }}
      OAUTH_CALLBACK_URLS_JSON: ${{ vars.OAUTH_CALLBACK_URLS_JSON }}
      WEB_CALLBACK_URLS_JSON: ${{ vars.WEB_CALLBACK_URLS_JSON }}
      BILLING_EMAIL: ${{ vars.BILLING_EMAIL }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'lusmaker' }}
      TF_VAR_environment: ${{ vars.DEPLOY_ENVIRONMENT || 'prod' }}
      TF_VAR_region_slug: ${{ vars.LUSMAKER_REGION_SLUG || 'vlaanderen' }}
      TF_VAR_oauth_callback_urls: ${{ vars.OAUTH_CALLBACK_URLS_JSON }}
      TF_VAR_web_callback_urls: ${{ vars.WEB_CALLBACK_URLS_JSON }}
      TF_VAR_enable_application_monitoring: ${{ vars.ENABLE_APPLICATION_MONITORING || 'false' }}
      TF_VAR_metrics_salt: ${{ secrets.METRICS_SALT }}
      TF_VAR_google_maps_api_key: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      LUSMAKER_GH_IMAGE: israelhikingmap/graphhopper:11.0
      ROLLBACK_DIGEST: ${{ inputs.image_digest }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Weiger een achterhaalde main-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/commits/main --jq .sha)" = "$GITHUB_SHA"

      - name: Controleer rollback-digest
        if: env.ROLLBACK_DIGEST != ''
        run: |
          if ! printf '%s' "$ROLLBACK_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "image_digest moet de vorm sha256:<64 hex-tekens> hebben" >&2
            exit 1
          fi
          echo "### Rollback naar $ROLLBACK_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Controleer deploymentconfiguratie
        run: |
          test -n "$AWS_ROLE_TO_ASSUME"
          test -n "$TF_STATE_BUCKET"
          test -n "$OAUTH_CALLBACK_URLS_JSON"
          test -n "$WEB_CALLBACK_URLS_JSON"
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' \
            <<< "$OAUTH_CALLBACK_URLS_JSON" >/dev/null
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' \
            <<< "$WEB_CALLBACK_URLS_JSON" >/dev/null

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Installeer pack-validator
        run: python -m pip install --disable-pip-version-check -e .

      - name: Neem tijdelijke AWS-credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Download en valideer regiopack
        id: pack
        if: env.ROLLBACK_DIGEST == ''
        run: |
          PACK="$RUNNER_TEMP/${REGION_SLUG}.tar.gz"
          aws s3 cp \
            "s3://${TF_STATE_BUCKET}/region-packs/${REGION_SLUG}.tar.gz" \
            "$PACK"
          python deploy/aws/prepare_region.py "$PACK" "$REGION_SLUG" .aws/region
          PACK_SHA=$(sha256sum "$PACK" | cut -d ' ' -f 1)
          echo "sha=$PACK_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}-${PACK_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Bouw en activeer Vlaamse brondata voor de cloudengine
        if: env.REGION_SLUG == 'vlaanderen' && env.ROLLBACK_DIGEST == ''
        id: sources
        env:
          REFRESH_SOURCES: ${{ inputs.refresh_route_sources || 'false' }}
        run: |
          SOURCE_ROOT="$RUNNER_TEMP/route-data"
          SNAPSHOTS="s3://${TF_STATE_BUCKET}/region-packs/route-sources/vlaanderen/raw/"
          mkdir -p "$SOURCE_ROOT/raw"
          aws s3 sync "$SNAPSHOTS" "$SOURCE_ROOT/raw/" --only-show-errors
          REFRESH_ARGS=()
          if [ "$REFRESH_SOURCES" = true ]; then
            REFRESH_ARGS+=(--refresh)
          fi
          lus heat sync-vlaanderen --output "$SOURCE_ROOT" "${REFRESH_ARGS[@]}" > "$RUNNER_TEMP/route-sources.json"
          BUILD=$(jq -r '.build' "$RUNNER_TEMP/route-sources.json")
          BUILD_ID=$(jq -r '.build_id' "$RUNNER_TEMP/route-sources.json")
          python deploy/aws/prepare_sources.py "$BUILD" .aws/region
          aws s3 sync "$SOURCE_ROOT/raw/" "$SNAPSHOTS" --sse AES256 --only-show-errors
          aws s3 cp "$BUILD/manifest.json" \
            "s3://${TF_STATE_BUCKET}/region-packs/route-sources/vlaanderen/builds/$BUILD_ID/manifest.json" --sse AES256
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "### Vlaamse brondata" >> "$GITHUB_STEP_SUMMARY"
          echo "Build: $BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
          jq '{lagen, features}' "$RUNNER_TEMP/route-sources.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Initialiseer remote Terraform-state
        run: |
          terraform -chdir=infra/terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$PROJECT_NAME/$DEPLOY_ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Maak ECR-repository indien nodig
        run: |
          terraform -chdir=infra/terraform apply -auto-approve \
            -target=aws_ecr_repository.app \
            -target=aws_ecr_lifecycle_policy.app

      - name: Controleer rollback-image in ECR
        id: rollback
        if: env.ROLLBACK_DIGEST != ''
        run: |
          ECR_URL=$(terraform -chdir=infra/terraform output -raw ecr_repository_url)
          REPOSITORY_NAME=${ECR_URL#*/}
          aws ecr describe-images \
            --repository-name "$REPOSITORY_NAME" \
            --image-ids "imageDigest=$ROLLBACK_DIGEST" >/dev/null
          echo "uri=$ECR_URL@$ROLLBACK_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Bepaal immutable image-tag
        id: image
        if: env.ROLLBACK_DIGEST == ''
        run: |
          ECR_URL=$(terraform -chdir=infra/terraform output -raw ecr_repository_url)
          REPOSITORY_NAME=${ECR_URL#*/}
          SOURCE_ID="${{ steps.sources.outputs.id }}"
          IMAGE_TAG="${{ steps.pack.outputs.tag }}${SOURCE_ID:+-${SOURCE_ID:0:12}}"
          if aws ecr describe-images \
            --repository-name "$REPOSITORY_NAME" \
            --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          echo "ecr_url=$ECR_URL" >> "$GITHUB_OUTPUT"
          echo "repository=$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "uri=$ECR_URL:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

      - name: Login bij ECR
        if: steps.image.outputs.exists != 'true'
        run: |
          REGISTRY=${{ steps.image.outputs.ecr_url }}
          REGISTRY=${REGISTRY%%/*}
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Activeer Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4.2.0

      - name: Bouw en push Lambda-image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: deploy/aws/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          build-args: |
            GRAPH_HOPPER_IMAGE=israelhikingmap/graphhopper:11.0
            REGION_SLUG=${{ env.REGION_SLUG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Resolve image digest
        id: digest
        if: env.ROLLBACK_DIGEST == ''
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "${{ steps.image.outputs.repository }}" \
            --image-ids "imageTag=${{ steps.image.outputs.tag }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          test "${DIGEST#sha256:}" != "$DIGEST"
          echo "uri=${{ steps.image.outputs.ecr_url }}@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Plan applicatiestack
        run: |
          PLAN_ARGS=(-var="image_uri=${{ steps.rollback.outputs.uri || steps.digest.outputs.uri }}")
          if [ -n "$BILLING_EMAIL" ]; then
            PLAN_ARGS+=(-var="billing_email=$BILLING_EMAIL")
          fi
          terraform -chdir=infra/terraform plan \
            -out="$RUNNER_TEMP/lusmaker.tfplan" \
            "${PLAN_ARGS[@]}"

      - name: Deploy applicatiestack
        run: terraform -chdir=infra/terraform apply -auto-approve "$RUNNER_TEMP/lusmaker.tfplan"

      - name: Smoke-test publieke rand en Cognito-gate
        run: |
          HEALTH=$(terraform -chdir=infra/terraform output -raw health_endpoint)
          MCP=$(terraform -chdir=infra/terraform output -raw mcp_endpoint)
          API=$(terraform -chdir=infra/terraform output -raw api_endpoint)
          curl --fail --show-error --max-time 900 "$HEALTH" > "$RUNNER_TEMP/health.json"
          cat "$RUNNER_TEMP/health.json"
          # De API start vóór GraphHopper; controleer dat de router echt opkomt.
          curl --fail --show-error --max-time 900 "$HEALTH?router=1" > "$RUNNER_TEMP/router.json"
          jq -e '.status == "ok"' "$RUNNER_TEMP/router.json" >/dev/null
          if [ "$REGION_SLUG" = vlaanderen ] && [ -z "$ROLLBACK_DIGEST" ]; then
            jq -e --arg build "${{ steps.sources.outputs.id }}" \
              '.route_sources.build_id == $build and .route_sources.features > 0' "$RUNNER_TEMP/health.json"
          fi
          STATUS=$(curl --silent --show-error --output "$RUNNER_TEMP/mcp-body.json" \
            --write-out '%{http_code}' --request POST "$MCP")
          test "$STATUS" = "401"
          jq -e '.error | type == "string"' "$RUNNER_TEMP/mcp-body.json" >/dev/null
          API_STATUS=$(curl --silent --show-error --output "$RUNNER_TEMP/api-body.json" \
            --write-out '%{http_code}' "$API/api/routes")
          test "$API_STATUS" = "401"
          echo "### Lusmaker AWS" >> "$GITHUB_STEP_SUMMARY"
          echo "MCP endpoint: \`$MCP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Web API: \`$API/api\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ steps.rollback.outputs.uri || steps.digest.outputs.uri }}\`" >> "$GITHUB_STEP_SUMMARY"
